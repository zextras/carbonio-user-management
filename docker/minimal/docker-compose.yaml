services:
  mailbox:
    depends_on:
      openldap:
        condition: service_healthy
      postfix:
        condition: service_healthy
    image: registry.dev.zextras.com/dev/carbonio-mailbox:latest
    hostname: docker.demo.zextras.io
    restart: on-failure
    networks:
      - mailbox
    healthcheck:
      interval: 60s
      retries: 10
      start_period: 20s
      test: netcat -z localhost 8080 || exit 1
      timeout: 10s
    ports:
      - "7071:7071"
      - "8080:8080"
      - "5005:5005"
      - "7025:7025"
      - "7143:7143"

  openldap:
    image: registry.dev.zextras.com/dev/carbonio-openldap:latest
    restart: on-failure
    healthcheck:
      interval: 60s
      retries: 10
      start_period: 20s
      test: nc -z localhost 1389 || exit 1
      timeout: 10s
    networks:
      - mailbox
    ports:
      - "1389:1389"

  mariadb:
    image: registry.dev.zextras.com/dev/carbonio-mariadb:latest
    networks:
      - mailbox
    ports:
      - "3306:3306"

  webui:
    depends_on:
      - mailbox
    build:
      dockerfile: webui/Dockerfile
    network_mode: "host"
    ports:
      - "9000:9000"
      - "6071:6071"

  postfix:
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      interval: 60s
      retries: 10
      start_period: 20s
      test: netcat -z localhost 25 || exit 1
      timeout: 10s
    image: registry.dev.zextras.com/dev/carbonio-mta:latest
    networks:
      - mailbox
    ports:
      - "20025:25"

  user-management:
    networks:
      - mailbox
    depends_on:
      - mailbox
    build:
      context: ../minimal/carbonio-user-management
      dockerfile: Dockerfile
    container_name: carbonio-user-management
    volumes:
      - ../../boot/target:/app
    restart: on-failure
    environment:
      - CARBONIO_MAILBOX_HOST=mailbox
      - CARBONIO_MAILBOX_PORT=8080
    ports:
      - "20001:10000"

networks:
  mailbox: