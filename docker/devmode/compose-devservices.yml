# Minimal Carbonio stack for user-management dev mode.
# Based on https://github.com/Zextras/carbonio-dockerization
#
# Dev mode:  mvn -pl app quarkus:dev
#            (Quarkus Compose Dev Services starts this automatically)
#
# All services have "ignore: true" so Quarkus doesn't wait for ports or map config.
# Docker healthchecks + depends_on handle orchestration; the app uses Consul at runtime.

services:

  # --- Service discovery & config -----------------------------------------

  consul:
    image: hashicorp/consul:1.22.3
    ports:
      - "8500:8500"
    volumes:
      - ./utils/consul-init.sh:/consul/scripts/init.sh:ro
    entrypoint:
      - "sh"
      - "-c"
      - |
        consul agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0 \
          -data-dir=/consul/data -disable-host-node-id -log-level=WARN \
          -node=consul-server -hcl='disable_update_check = true' &
        CONSUL_PID=$$!
        # Wait for API, then init KV
        /consul/scripts/init.sh
        wait $$CONSUL_PID
    healthcheck:
      test: >-
        curl --fail --silent localhost:8500/v1/status/leader
        || exit 1
      interval: 5s
      retries: 30
      start_period: 5s
      timeout: 5s
    labels:
      io.quarkus.devservices.compose.ignore: "true"

  # --- Mailbox dependencies -----------------------------------------------

  carbonio-openldap:
    image: registry.dev.zextras.com/dev/carbonio-openldap:latest
    restart: on-failure
    healthcheck:
      test: nc -z localhost 1389 || exit 1
      interval: 10s
      retries: 30
      start_period: 10s
      timeout: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      io.quarkus.devservices.compose.ignore: "true"

  carbonio-mariadb:
    image: registry.dev.zextras.com/dev/carbonio-mariadb:latest
    restart: on-failure
    ports:
      - "3306"
    environment:
      - MARIADB_ROOT_PASSWORD=password
    labels:
      io.quarkus.devservices.compose.ignore: "true"

  carbonio-postfix:
    image: registry.dev.zextras.com/dev/carbonio-mta:latest
    restart: on-failure
    environment:
      - LDAP_HOST=carbonio-openldap
      - LDAP_PORT=1389
      - LDAP_ROOT_PASSWORD=qh6hWZvc
      - LDAP_ADMIN_PASSWORD=password
    healthcheck:
      test: netcat -z localhost 25 || exit 1
      interval: 10s
      retries: 30
      start_period: 20s
      timeout: 5s
    depends_on:
      carbonio-openldap:
        condition: service_healthy
    labels:
      io.quarkus.devservices.compose.ignore: "true"

  # --- Mailbox ------------------------------------------------------------

  carbonio-mailbox:
    image: registry.dev.zextras.com/dev/carbonio-mailbox:latest
    hostname: docker.carbonio.localhost
    restart: on-failure
    ports:
      - "20000:8080"
    environment:
      - LDAP_URL=ldap://carbonio-openldap:1389
      - LDAP_ROOT_PASSWORD=qh6hWZvc
      - LDAP_ADMIN_PASSWORD=password
      - MARIADB_ROOT_PASSWORD=password
      - MARIADB_URL=carbonio-mariadb
      - MARIADB_PORT=3306
    healthcheck:
      test: curl --fail --silent localhost:8080/service/health/ready || exit 1
      interval: 10s
      retries: 100
      start_period: 50s
      timeout: 20s
    depends_on:
      carbonio-openldap:
        condition: service_healthy
      carbonio-postfix:
        condition: service_healthy
      carbonio-mariadb:
        condition: service_started
    labels:
      io.quarkus.devservices.compose.ignore: "true"

  # --- Provisioning -------------------------------------------------------

  carbonio-provisioner:
    image: alpinelinux/docker-cli:latest
    depends_on:
      carbonio-mailbox:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./utils/provisioning.sh:/provisioning.sh:ro
    command: sh /provisioning.sh
    restart: "no"
    labels:
      io.quarkus.devservices.compose.ignore: "true"
