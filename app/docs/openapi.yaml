---
openapi: 3.1.0
components:
  schemas:
    AccountRightsDto:
      type: object
      properties:
        actorId:
          type: string
        targetId:
          type: string
        isGlobalAdmin:
          type: boolean
        isDelegatedAdmin:
          type: boolean
        canWrite:
          type: boolean
        canConfigure:
          type: boolean
    GroupMembershipResponse:
      type: object
      properties:
        member:
          type: boolean
        direct:
          type: boolean
    MyselfDto:
      type: object
      properties:
        info:
          $ref: "#/components/schemas/UserInfoDto"
        locale:
          type: string
        features:
          type: array
          items:
            type: string
        capabilities:
          type: object
          additionalProperties:
            type: string
    RightCheckRequest:
      type: object
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        right:
          type: string
        target:
          $ref: "#/components/schemas/Target"
    RightCheckResponse:
      type: object
      properties:
        allowed:
          type: boolean
    RightInfoDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        userRight:
          type: boolean
        description:
          type: string
    Subject:
      type: object
      properties:
        token:
          type: string
        accountId:
          type: string
    Target:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
    UserInfoDto:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        fullName:
          type: string
        domain:
          type: string
        status:
          type: string
        type:
          type: string
        cosId:
          type: string
        domainId:
          type: string
        isGlobalAdmin:
          type: boolean
paths:
  /internal/groups/membership:
    get:
      parameters:
      - name: accountId
        in: query
        schema:
          type: string
      - name: group
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembershipResponse"
      summary: Membership
      tags:
      - Group Resource
  /internal/rights:
    get:
      parameters:
      - name: targetType
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RightInfoDto"
      summary: List Rights
      tags:
      - Rights Resource
  /internal/rights/accounts/{targetId}:
    get:
      parameters:
      - name: targetId
        in: path
        required: true
        schema:
          type: string
      - name: actorId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRightsDto"
      summary: Account Rights
      tags:
      - Rights Resource
  /internal/rights/check:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RightCheckRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightCheckResponse"
        "400":
          description: Bad Request
      summary: Check
      tags:
      - Rights Resource
  /internal/users:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoDto"
        "400":
          description: Bad Request
      summary: Get Users
      tags:
      - User Resource
  /internal/users/email/{email}:
    get:
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
      summary: Get By Email
      tags:
      - User Resource
  /internal/users/id/{userId}:
    get:
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoDto"
      summary: Get By Id
      tags:
      - User Resource
  /internal/users/myself:
    get:
      parameters:
      - name: bypassCache
        in: query
        schema:
          type: boolean
      - name: ZM_AUTH_TOKEN
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyselfDto"
      summary: Get Myself
      tags:
      - User Resource
info:
  title: carbonio-user-management API
  version: unversioned
servers:
- url: http://localhost:10000
