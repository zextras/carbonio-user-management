---
openapi: 3.1.0
paths:
  /users:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Get Users
      tags:
      - User Resource
  /users/email/{email}:
    get:
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Get By Email
      tags:
      - User Resource
  /users/id/{userId}:
    get:
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Get By Id
      tags:
      - User Resource
  /users/myself:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Get Myself
      tags:
      - User Resource
info:
  title: carbonio-user-management API
  version: unversioned
servers:
- url: http://localhost:10000
