carbonio.service.name=carbonio-user-management
quarkus.application.name=carbonio-user-management

quarkus.otel.sdk.disabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

networking-config.carbonio.service.host=127.78.0.5
networking-config.carbonio.service.port=10000

networking-config.carbonio.service-discover.host=127.0.0.1
networking-config.carbonio.service-discover.port=8500

# Mailbox Internal API (Consul mesh upstream)
networking-config.carbonio.mailbox.internal.host=127.78.0.5
networking-config.carbonio.mailbox.internal.port=20001

application-config.cache.userinfo-ttl=43200

quarkus.package.jar.type=uber-jar
quarkus.smallrye-openapi.servers=http://localhost:10000

quarkus.devservices.enabled=false

# ------------------------------------------------------------

%test.quarkus.test.arg-line=--enable-preview --enable-native-access=ALL-UNNAMED
%test.networking-config.carbonio.service.host=localhost
